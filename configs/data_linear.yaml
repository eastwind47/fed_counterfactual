# Data-generation config — 6-client controlled block-LTI system.
#
# Model:  x(t+1) = A x(t) + B u(t) + w(t),   w ~ N(0, Q)   process noise
#         y(t)   = C x(t)          + v(t),   v ~ N(0, R)   measurement noise
#
# Diagonal blocks A_mm, B_mm and the block-diagonal C_mm are known to each client.
# Off-diagonal blocks A_mn, B_mn are the inter-component coupling the federated
# learner estimates. Controls u are configured per split (see train/test below).
# The same true matrices A, B, C, Q, R are used for both the train and test splits;
# only the control realization, noise, and x0 differ between splits.

system:
  num_components: 6
  state_dims:  [2, 2, 2, 2, 2, 2]   # P_m: state dimension per component
  obs_dims:    [8, 8, 8, 8, 8, 8]   # D_m: observation dimension per component
  input_dims:  [2, 2, 2, 2, 2, 2]   # S_m: control-input dimension per component
  seed: 42                          # single RNG seed — fix to reproduce exactly
  dependencies:                      # A's directed coupling edges (src, dst), 0-based.
                                     #   edge (src, dst) => block A[dst, src] nonzero:
                                     #   "client src influences client dst's state"
    - [0, 1]
    - [0, 2]
    - [0, 3]
    - [1, 2]
    - [1, 3]
    - [2, 3]
    - [2, 5]
    - [3, 4]
    - [4, 5]
    - [1, 4]
    - [1, 5]
    - [5, 1]
    - [3, 5]
    - [5, 3]
    - [4, 0]
    - [4, 2]
    - [5, 0]
    - [5, 2]
    - [3, 0]

matrices:
  # A: block state matrix (diagonal A_mm known; off-diagonal A_mn = coupling to learn)
  A:
    off_diagonal_scale: 1.0          # A_mn magnitude relative to A_mm before stability scaling
    spectral_radius_target: 0.6      # rescale A so max|eig(A)| = 0.6 (stable, uniform scales)

  # B: block input matrix (diagonal B_mm known; off-diagonal B_mn = control coupling to learn)
  B:
    diag_low:  0.05                  # B_mm entries ~ U(diag_low, diag_high)
    diag_high: 0.5
    off_diagonal_scale: 1.0          # B_mn magnitude relative to B_mm entries
    # coupling: which off-diagonal B_mn blocks are nonzero. Options:
    #   "dense"  -> every off-diagonal block (all n != m)              [default]
    #   "shared" -> reuse the state-coupling edges in system.dependencies
    #   "custom" -> use the explicit edge list in matrices.B.dependencies below
    #   "none"   -> block-diagonal B (no control coupling to learn)
    coupling: dense
    # Directed (src, dst) edges for B_mn, 0-based; SAME format/semantics as
    # system.dependencies. Used ONLY when coupling == "custom".
    dependencies: []

  # C: block-diagonal observation matrix (each client observes only its own state)
  C:
    type: normal                     # C_m[i,j] ~ N(mean, std^2); full column rank a.s. when D_m >= P_m
    mean: 0.0
    std:  1.0

  # Q: process-noise variance per component — Q_m = value * I_{P_m}
  Q: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

  # R: measurement-noise variance per component — R_m = value * I_{D_m}
  R: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

# Train split: long trajectory used to learn A_mn, B_mn, theta, phi.
train:
  total_time: 30000                  # T_train: number of timesteps
  x0_mean: 0.0                       # initial-state mean (per element)
  x0_std:  0.5                       # initial-state std (per element); varies realizations
  controls:
    type: gaussian                   # PE white noise u ~ N(mu, sigma^2) at every step
    mu:    0.0                       # control-input mean
    sigma: 1.0                       # control-input std (variance = sigma^2)

# Test split: held-out factual trajectory (same true matrices; own controls, noise, x0).
# Used as the factual for counterfactual experiments and for the filter comparison.
test:
  total_time: 3000                   # T_test: number of timesteps
  x0_mean: 0.0
  x0_std:  0.5
  controls:
    # type: gaussian   -> u ~ N(mu, sigma^2) at every step (mu, sigma keys as in train).
    # type: mean_shift -> u = 0 outside windows; inside each window the targeted
    #   components get u ~ N(mu, sigma^2). components: list of 0-based ids or "all".
    #   A shift_labels.csv (1 inside any window) is saved for the filter comparison.
    type: mean_shift
    windows:
      - {t_start: 300,  t_end: 600,  components: [0],    mu:  3.0, sigma: 1.0}  # single-source
      - {t_start: 1000, t_end: 1300, components: [0, 2], mu: -2.0, sigma: 0.5}  # multi-source
      - {t_start: 2000, t_end: 2300, components: "all",  mu:  1.5, sigma: 0.8}  # global
